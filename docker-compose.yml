
# Use extended yaml syntax to define a logging configuration that can be reused across services.
x-logging: &default-logging
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"

services:
  tailscale:
    image: tailscale/tailscale:latest
    hostname: mac-mini-media
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./ts-config:/config
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    restart: unless-stopped

  landing:
    image: nginx:alpine
    network_mode: service:tailscale
    depends_on:
      - tailscale
    volumes:
      - ./landing/static/index.html:/usr/share/nginx/html/index.html:ro
      - ./landing/conf/nginx.conf:/etc/nginx/conf.d/default.conf
    restart: unless-stopped
    <<: *default-logging 

  navidrome:
    image: deluan/navidrome:latest
    network_mode: service:tailscale
    depends_on:
      - tailscale
    user: 501:20 # should be owner of volumes
    environment:
      ND_AGENTS: "apple-music,deezer,lastfm,listenbrainz"
      ND_SCANNER_SCHEDULE: "@every 24h"
      ND_BASEURL: "/navidrome"
      ND_PLUGINS_ENABLED: "true"
      ND_PLUGINS_AUTORELOAD: "true"
      ND_PLUGINS_LOGLEVEL: "debug"
      ND_PLUGINS_CACHESIZE: "200MB"
    volumes:
      - ${NAVIDROME_DATA_PATH}:/data
      - ${NAVIDROME_MUSIC_PATH}:/music:ro
    restart: unless-stopped
    <<: *default-logging 

  filebrowser:
    image: gtstef/filebrowser:beta
    network_mode: service:tailscale
    depends_on:
      - tailscale
    healthcheck:
      # default port is 80 for healthcheck, but it's changed at /filebrowser-data/config.yaml.
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"] 
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    volumes:
      - ${MEDIA_PATH}:/media
      - ./filebrowser-data:/home/filebrowser/data
    restart: unless-stopped
    <<: *default-logging 

  glances:
    image: nicolargo/glances:latest
    network_mode: service:tailscale
    depends_on:
      - tailscale
    pid: host
    environment:
      - GLANCES_OPT=-w
    volumes:
      - /proc:/host/proc:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    <<: *default-logging 

  jellyfin:
    image: jellyfin/jellyfin
    network_mode: service:tailscale
    depends_on:
      - tailscale
    user: 501:20
    volumes:
      - ${JELLYFIN_DATA_PATH}/config:/config
      - ${JELLYFIN_DATA_PATH}/cache:/cache
      - type: bind
        source: ${MEDIA_PATH}
        target: /media
    restart: 'unless-stopped'
    <<: *default-logging 

volumes:
  tailscale-state:
