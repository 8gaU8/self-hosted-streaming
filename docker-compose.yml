
# Use extended yaml syntax to define a logging configuration that can be reused across services.
x-logging: &default-logging
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"

services:
  # Landing page: serves the dashboard UI, reverse-proxies jellyfin/navidrome/
  # filebrowser (replacing the old nginx `landing` service), reports
  # per-service health + CPU/memory/disk-I/O usage read from the Docker
  # socket, and is itself the tailnet entry point via tsnet (replacing the
  # old standalone `tailscale` service). It also passes through
  # Navidrome/Filebrowser/Jellyfin's own ports directly on the tailnet for
  # native apps that don't go through the dashboard's proxy.
  landing:
    build: ./landing
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_HOSTNAME=${TS_HOSTNAME}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - landing-tsnet-state:/var/lib/tsnet
    depends_on:
      - navidrome
      - filebrowser
      - jellyfin
    restart: unless-stopped
    <<: *default-logging

  navidrome:
    image: deluan/navidrome:latest
    user: 501:20 # should be owner of volumes
    environment:
      ND_AGENTS: "apple-music,deezer,lastfm,listenbrainz"
      ND_SCANNER_SCHEDULE: "@every 24h"
      ND_BASEURL: "/navidrome"
      ND_PLUGINS_ENABLED: "true"
      ND_PLUGINS_AUTORELOAD: "true"
      ND_PLUGINS_LOGLEVEL: "debug"
      ND_PLUGINS_CACHESIZE: "200MB"
    volumes:
      - ${NAVIDROME_DATA_PATH}:/data
      - ${NAVIDROME_MUSIC_PATH}:/music:ro
    restart: unless-stopped
    <<: *default-logging

  filebrowser:
    image: gtstef/filebrowser:beta
    healthcheck:
      # default port is 80 for healthcheck, but it's changed at /filebrowser-data/config.yaml.
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    volumes:
      - ${MEDIA_PATH}:/media
      - ${FILEBROWSER_DATA_PATH}:/home/filebrowser/data
      - ./filebrowser-data/config.yaml:/home/filebrowser/data/config.yaml:ro
    restart: unless-stopped
    <<: *default-logging

  jellyfin:
    image: jellyfin/jellyfin
    user: 501:20
    volumes:
      - ${JELLYFIN_DATA_PATH}/config:/config
      - ${JELLYFIN_DATA_PATH}/cache:/cache
      - type: bind
        source: ${MEDIA_PATH}
        target: /media
    restart: 'unless-stopped'
    <<: *default-logging

volumes:
  landing-tsnet-state:
