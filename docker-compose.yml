include:
  - immich/docker-compose.yml

# Use extended yaml syntax to define a logging configuration that can be reused across services.
x-logging: &default-logging
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"

services:
  # Tailnet entry point: navidrome/jellyfin/immich share this container's
  # network namespace, so each is reachable at
  # http://${TS_HOSTNAME}:<its own port> on the tailnet.
  tailscale:
    image: tailscale/tailscale:latest
    hostname: ${TS_HOSTNAME}
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
      - TS_AUTH_ONCE=true
    volumes:
      # Reuses the old tsnet node's state so this stays the same machine
      # (same IP, same shares) on the tailnet.
      - landing-tsnet-state:/var/lib/tailscale
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    restart: unless-stopped
    <<: *default-logging

  navidrome:
    image: deluan/navidrome:latest
    network_mode: service:tailscale
    depends_on:
      - tailscale
    user: 501:20 # should be owner of volumes
    environment:
      ND_AGENTS: "apple-music,deezer,lastfm,listenbrainz"
      ND_SCANNER_SCHEDULE: "@every 24h"
      ND_PLUGINS_ENABLED: "true"
      ND_PLUGINS_AUTORELOAD: "true"
      ND_PLUGINS_LOGLEVEL: "debug"
      ND_PLUGINS_CACHESIZE: "200MB"
    volumes:
      - ${NAVIDROME_DATA_PATH}:/data
      - ${NAVIDROME_MUSIC_PATH}:/music:ro
    restart: unless-stopped
    <<: *default-logging

  jellyfin:
    image: jellyfin/jellyfin
    network_mode: service:tailscale
    depends_on:
      - tailscale
    user: 501:20
    volumes:
      - ${JELLYFIN_DATA_PATH}/config:/config
      - ${JELLYFIN_DATA_PATH}/cache:/cache
      - type: bind
        source: ${MEDIA_PATH}
        target: /media
    restart: 'unless-stopped'
    <<: *default-logging

volumes:
  landing-tsnet-state:
